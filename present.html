<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro-Menti | Presenter Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="present.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body class="selection-purple grid-lines" style="overflow: hidden">
    <div class="ambient-glow">
      <div
        class="glow-blob glow-blob-purple"
        style="top: -10%; left: -10%"
      ></div>
      <div
        class="glow-blob glow-blob-cyan"
        style="bottom: 15%; right: -10%"
      ></div>
      <div
        class="glow-blob glow-blob-blue"
        style="bottom: -10%; left: 20%"
      ></div>
    </div>
    <div id="particle-container"></div>
    <div class="dashboard-grid">
      <header class="app-header">
        <div class="header-left">
          <button
            class="header-btn menu-toggle-btn"
            id="menuToggleBtn"
            aria-label="Toggle Control Panel Drawer"
            aria-expanded="false"
            aria-controls="controlSidebar"
          >
            <span class="material-symbols-outlined">menu</span>
          </button>
          <a
            href="index.html"
            class="logo-section"
            aria-label="Micro-Menti Presenter Home"
          >
            <svg
              viewBox="0 0 100 100"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              style="height: 24px; width: 24px"
            >
              <path
                d="M18.5 54.5L53.5 33.5L63.5 43.5H79L89.5 54.5"
                stroke="#A5B4FC"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.8"
              />
              <rect
                x="24"
                y="39"
                width="30"
                height="10"
                rx="5"
                fill="#5B62F4"
              />
              <rect
                x="59"
                y="34"
                width="20"
                height="7.5"
                rx="3.75"
                fill="#13B497"
              />
              <rect
                x="34"
                y="54"
                width="40"
                height="15"
                rx="7.5"
                fill="#7E80FE"
              />
              <rect
                x="26.5"
                y="74"
                width="25"
                height="9"
                rx="4.5"
                fill="#6FD6C6"
              />
            </svg>
            <span class="logo-text">Micro-Menti</span>
          </a>
          <span
            class="room-title"
            id="roomTitle"
            aria-label="Current room"
          ></span>
        </div>
        <div class="session-badge" aria-label="Session connection parameters">
          <span class="session-url"
            >Join at <strong>micro-menti.io</strong></span
          >
          <div class="session-code-container">
            <span class="session-code-label">Code</span>
            <span class="session-code" id="sessionCodeVal"></span>
          </div>
        </div>
        <div class="header-right">
          <div class="live-badge" aria-label="Status: Live voting active">
            <span class="live-dot" aria-hidden="true"></span>
            <span>LIVE</span>
          </div>
          <div
            class="session-badge"
            style="padding: var(--space-2) var(--space-3)"
            aria-label="Total participants connected"
          >
            <span
              class="material-symbols-outlined"
              style="color: var(--primary); font-size: 16px; margin-right: 4px"
              >group</span
            >
            <span
              class="font-mono"
              style="font-size: 13px; color: var(--text-main); font-weight: 600"
              >342 Joined</span
            >
          </div>
          <div class="qr-panel" aria-label="Scan to join this session">
            <div id="qrcode"></div>
            <span class="qr-label">Scan to join</span>
          </div>
          <button
            class="header-btn"
            id="fullscreenBtn"
            aria-label="Toggle Fullscreen Presentation Mode"
          >
            <span class="material-symbols-outlined" id="fullscreenIcon"
              >fullscreen</span
            >
          </button>
        </div>
      </header>
      <aside
        class="control-sidebar"
        id="controlSidebar"
        role="complementary"
        aria-label="Poll Controls"
      >
        <div>
          <h2 class="sidebar-title">Poll Controls</h2>
          <nav class="control-group" aria-label="Presenter Action Options">
            <button
              class="control-btn danger-action"
              id="clearPollBtn"
              aria-label="Clear the live word cloud"
            >
              <span class="material-symbols-outlined" aria-hidden="true"
                >delete_sweep</span
              ><span>Clear Poll</span>
            </button>
            <button
              class="control-btn"
              id="lockPollBtn"
              aria-label="Lock poll entries"
            >
              <span
                class="material-symbols-outlined"
                id="lockBtnIcon"
                aria-hidden="true"
                >lock</span
              ><span id="lockBtnText">Lock Poll</span>
            </button>
            <button
              class="control-btn"
              id="pausePollBtn"
              aria-label="Pause incoming response animations"
            >
              <span
                class="material-symbols-outlined"
                id="pauseBtnIcon"
                aria-hidden="true"
                >pause</span
              ><span id="pauseBtnText">Pause Poll</span>
            </button>
            <button
              class="control-btn"
              id="downloadImageBtn"
              aria-label="Download word cloud canvas as an image"
            >
              <span class="material-symbols-outlined" aria-hidden="true"
                >download</span
              ><span>Download Image</span>
            </button>
            <button
              class="control-btn"
              id="settingsBtn"
              aria-label="Open presentation settings dashboard"
            >
              <span class="material-symbols-outlined" aria-hidden="true"
                >settings</span
              ><span>Settings</span>
            </button>
            <a
              href="index.html"
              class="control-btn"
              style="text-decoration: none"
              ><span class="material-symbols-outlined" aria-hidden="true"
                >logout</span
              ><span>End Session</span></a
            >
          </nav>
        </div>
        <div class="sidebar-footer">
          <div class="system-status-card" aria-label="System status online">
            <div class="system-indicator" aria-hidden="true"></div>
            <span class="system-text">System Online</span>
          </div>
        </div>
      </aside>
      <div
        class="drawer-overlay"
        id="drawerOverlay"
        role="presentation"
        aria-hidden="true"
      ></div>
      <main class="main-content">
        <div
          class="response-counter-widget"
          aria-label="Total responses registered"
        >
          <span class="response-count" id="responseCounterVal">342</span>
          <span class="response-label">Responses</span>
        </div>
        <section
          class="question-container"
          aria-labelledby="activeQuestionHeader"
        >
          <span class="question-label">Active Question</span>
          <h1 class="question-text" id="activeQuestionHeader">
            Describe microservices in one word
          </h1>
        </section>
        <div class="cloud-container">
          <div
            class="cloud-wrapper"
            id="cloud"
            aria-label="Live Word Cloud Results"
          ></div>
        </div>
        <div class="progress-laser-track" aria-hidden="true">
          <div class="progress-laser-fill"></div>
        </div>
      </main>
      <footer class="status-bar" role="contentinfo">
        <div class="telemetry-group">
          <div class="telemetry-item">
            <span class="telemetry-label">Latency:</span
            ><span class="telemetry-val">14ms</span>
          </div>
          <div class="telemetry-divider" aria-hidden="true"></div>
          <div class="telemetry-item">
            <span class="telemetry-label">Connection:</span
            ><span class="telemetry-val" style="color: var(--success)"
              >Secure</span
            >
          </div>
          <div class="telemetry-divider" aria-hidden="true"></div>
          <div class="telemetry-item">
            <span class="telemetry-label">Transport:</span
            ><span class="telemetry-val" style="color: var(--success)"
              >WebSockets</span
            >
          </div>
          <div class="telemetry-divider" aria-hidden="true"></div>
          <div class="telemetry-item">
            <span class="telemetry-label">Participants:</span
            ><span
              class="telemetry-val"
              style="color: var(--success)"
              id="footerParticipantsVal"
              >342</span
            >
          </div>
        </div>
        <div class="status-links">
          <a
            href="#"
            class="status-link"
            aria-label="System status board website link"
            >System Status</a
          >
          <a
            href="#"
            class="status-link"
            aria-label="Micro-Menti developer documentation link"
            >Documentation</a
          >
        </div>
      </footer>
    </div>
    <div id="toastContainer"></div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="present.js" defer></script>
  </body>
</html>
