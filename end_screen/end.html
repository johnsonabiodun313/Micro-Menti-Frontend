<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Menti</title>
<link rel="stylesheet" href="./end.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="topbar">
      <h1 class="logo">Micro-Menti</h1>
      <div class="join-code">Join:<br>5591</div>
    </header>

    <!-- Spacer where the live question / word cloud would normally be -->
    <div class="stage"></div>

    <!-- Session ended card -->
    <main class="card">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" class="cloud-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 17.5C4.01 17.5 2 15.49 2 13c0-2.28 1.7-4.16 3.9-4.46C6.5 6.2 8.98 4.25 12 4.25c3.15 0 5.75 2.35 6.15 5.4 2.16.36 3.85 2.24 3.85 4.5 0 2.49-2.01 4.35-4.5 4.35H6.5z" fill="currentColor" opacity="0.9"/>
          <path d="M8.5 13l2.4 2.4L15.8 10.4" stroke="#0b0e14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 class="headline">This session has ended. Thanks for contributing!</h2>

      <p class="subline">Your input helped shape the cloud.
        <span class="cursor-block"></span>
      </p>
      <p class="subline centered-block">
        <span class="cursor-block"></span>
      </p>

      <div class="divider"></div>

      <div class="stat-row">
        <span class="stat-label">CONTRIBUTIONS</span>
        <span class="stat-value teal">08 words</span>
      </div>

      <div class="stat-row">
        <span class="stat-label">SESSION RANK</span>
        <span class="stat-value teal">Top 12%</span>
      </div>

      <button class="export-btn" id="exportBtn">EXPORT MY CLOUD</button>
    </main>

    <!-- Bottom action bar -->
    <nav class="bottombar">
      <button class="nav-btn" id="clearBtn">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>CLEAR</span>
      </button>

      <button class="nav-btn" id="lockedBtn" disabled>
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>LOCKED</span>
      </button>

      <button class="nav-btn nav-btn--primary" id="saveBtn">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>SAVE</span>
      </button>
    </nav>

    <!-- Status bar -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-text">Latency: <span id="latencyValue">12ms</span> | Transport: WebSockets | Connected: <span id="connectedValue">342</span></span>
      </div>
      <div class="status-right">
        <span class="status-link">System Status</span>
        <span class="status-link">Documentation</span>
      </div>
    </footer>

  </div>

<script src="./end.js"></script>
</body>
</html>
