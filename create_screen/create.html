<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Micro-Menti</title>
<link rel="stylesheet" href="./create.css" />
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">Micro-Menti</div>
    <div class="join-badge">
      <span class="dot"></span>
      Join: <span id="join-code">5591</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="hero">

      <div class="badge">
        <span class="badge-dot"></span>
        INITIALIZATION PROTOCOL
      </div>

      <h1 class="headline">
        Ready to launch your <span class="highlight">Micro-Menti?</span>
      </h1>

      <div class="poll-card">
        <div class="poll-card-header">
          <span>ENTER YOUR POLL QUESTION OR TOPIC</span>
          <span class="utf8-tag">UTF-8 ENCODED</span>
        </div>

        <div class="input-wrapper">
          <input
            type="text"
            id="poll-input"
            placeholder="e.g., Describe microservices in one word"
          />
          <span class="enter-icon">&#8617;</span>
        </div>

        <div class="action-row">
          <a href="/Micro-Menti-Frontend/contribute_screen/contibute.html">
          <button class="go-live-btn" id="go-live-btn">
            <span class="bolt">&#9889;</span>
            Go Live Instantly (Launches WebSockets)
          </button>
          </a>
          <button class="settings-icon-btn" id="settings-icon-btn" aria-label="Poll settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">LATENCY</div>
          <div class="stat-value green" id="latency-value">12ms</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">HANDSHAKE</div>
          <div class="stat-value green">Sec-WebSocket</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">STATUS</div>
          <div class="stat-value green"><span class="status-dot"></span>READY</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">VERSION</div>
          <div class="stat-value">v2.4.0-edge</div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <span class="footer-item">NaNms</span>
    <span class="footer-item">System</span>
    <span class="footer-item">Documentation</span>
  </footer>

  <script src="./create.js"></script>
</body>
</html>
